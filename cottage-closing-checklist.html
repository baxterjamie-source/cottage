<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cottage Closing Checklist</title>
<style>
  :root {
    --bg: #f5f1e8;
    --card-bg: #ffffff;
    --border: #d9d2c2;
    --text: #2e2a24;
    --muted: #756e60;
    --green: #2e7d4f;
    --green-light: #e6f4ea;
    --section-bg: #efe9d8;
    --accent: #8a6d3b;
    --red: #b3453c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 16px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    max-width: 640px;
    margin: 0 auto;
    padding-top: 24px;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0 0 16px;
  }
  .progress-wrap {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .progress-text {
    font-size: 0.9rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .progress-bar-bg {
    flex: 1;
    height: 8px;
    background: var(--section-bg);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--green);
    width: 0%;
    transition: width 0.2s ease;
  }
  #resetBtn {
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
    white-space: nowrap;
  }
  #resetBtn:hover {
    background: var(--section-bg);
    color: var(--text);
  }
  .add-item-wrap {
    margin-bottom: 20px;
  }
  #addItemToggle {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    border: 1px dashed var(--accent);
    background: var(--card-bg);
    color: var(--accent);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
  }
  #addItemToggle:hover {
    background: var(--green-light);
  }
  .add-item-note {
    font-size: 0.75rem;
    font-weight: 400;
    color: var(--muted);
  }
  #addItemForm {
    display: none;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-top: 10px;
  }
  #addItemForm.open {
    display: block;
  }
  .field-label {
    display: block;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--accent);
    margin: 10px 0 4px;
  }
  .field-label:first-child {
    margin-top: 0;
  }
  #addItemForm select,
  #addItemForm input[type="text"],
  #addItemForm textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.9rem;
    font-family: inherit;
    color: var(--text);
    background: #fffdf9;
    resize: vertical;
  }
  #addItemForm textarea {
    min-height: 46px;
  }
  .add-item-actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  #submitNewItem {
    flex: 1;
    background: var(--green);
    color: #fff;
    border: none;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  #submitNewItem:hover {
    background: #256541;
  }
  #cancelNewItem {
    background: var(--card-bg);
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  #cancelNewItem:hover {
    background: var(--section-bg);
  }
  main {
    max-width: 640px;
    margin: 0 auto;
  }
  .section {
    margin-bottom: 24px;
  }
  .section-title {
    font-weight: 700;
    color: var(--accent);
    margin: 0 0 8px 4px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    font-size: 0.85rem;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .item {
    border-bottom: 1px solid var(--border);
  }
  .item:last-child {
    border-bottom: none;
  }
  .item-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
  }
  .check-circle {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid #b9b09a;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin-top: 1px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .check-circle svg {
    width: 15px;
    height: 15px;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .item.checked .check-circle {
    background: var(--green);
    border-color: var(--green);
  }
  .item.checked .check-circle svg {
    opacity: 1;
  }
  .item-text-wrap {
    flex: 1;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: flex-start;
    gap: 6px;
  }
  .item-text {
    font-size: 1rem;
    line-height: 1.35;
    transition: color 0.15s ease;
  }
  .item.checked .item-text {
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-color: var(--green);
    text-decoration-thickness: 2px;
  }
  .disclosure-arrow {
    flex: 0 0 auto;
    font-size: 1.3rem;
    line-height: 1;
    color: var(--accent);
    margin-top: -2px;
    transition: transform 0.15s ease;
  }
  .item.open .disclosure-arrow {
    transform: scaleY(-1);
  }
  .remove-btn {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--red);
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin-top: 1px;
  }
  .remove-btn:hover {
    background: #fbe9e7;
  }
  .detail {
    display: none;
    padding: 0 14px 14px 52px;
  }
  .item.open .detail {
    display: block;
  }
  .how-box {
    background: var(--section-bg);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.9rem;
    line-height: 1.4;
    color: var(--text);
  }
  .how-label {
    font-weight: 700;
    color: var(--accent);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    display: block;
    margin-bottom: 3px;
  }
  .why-toggle {
    display: inline-block;
    margin-top: 8px;
    font-size: 0.82rem;
    color: var(--green);
    font-weight: 600;
    cursor: pointer;
    text-decoration: underline;
    text-decoration-style: dotted;
  }
  .why-box {
    display: none;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
    font-size: 0.88rem;
    line-height: 1.4;
    color: var(--text);
    font-style: italic;
  }
  .why-box.open {
    display: block;
  }
  .custom-tag {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--green);
    background: var(--green-light);
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 6px;
    vertical-align: middle;
  }
  footer {
    max-width: 640px;
    margin: 32px auto 0;
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
  }
</style>
</head>
<body>

<header>
  <h1>Cottage Closing Checklist</h1>
  <p class="subtitle">Tap the circle to check off. Tap an item for how (and why).</p>
  <div class="progress-wrap">
    <span class="progress-text" id="progressText">0 / 0</span>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
    <button id="resetBtn">Reset</button>
  </div>

  <div class="add-item-wrap">
    <button id="addItemToggle" type="button">
      <span id="addItemToggleLabel">+ Add Item</span>
      <span class="add-item-note">(saved in this browser only — not synced across devices)</span>
    </button>
    <div id="addItemForm">
      <label class="field-label" for="newItemSection">Section</label>
      <select id="newItemSection"></select>

      <label class="field-label" for="newItemText">Item</label>
      <input type="text" id="newItemText" placeholder="e.g. Cover the canoe">

      <label class="field-label" for="newItemHow">How <span style="font-weight:400; text-transform:none; letter-spacing:normal;">(optional)</span></label>
      <textarea id="newItemHow" placeholder="Details on how to do it"></textarea>

      <label class="field-label" for="newItemWhy">Why <span style="font-weight:400; text-transform:none; letter-spacing:normal;">(optional)</span></label>
      <textarea id="newItemWhy" placeholder="Why it matters"></textarea>

      <div class="add-item-actions">
        <button id="submitNewItem" type="button">Add Item</button>
        <button id="cancelNewItem" type="button">Cancel</button>
      </div>
    </div>
  </div>
</header>

<main id="main"></main>

<footer>Progress and any items you add are saved on this device. Tap Reset before your next closing.</footer>

<script>
const DATA = [
  {
    section: "Basement",
    items: [
      { id: "b1", text: "Turn off water pump switch", how: "Behind the basement door, above the blue pressure tank on the wall there is a switch.", why: "Prevent flooding and pump burnout." },
      { id: "b2", text: "Close two blue-handled valves (winter)", how: "One down low near the pressure tank, one higher near the hot water heater. Parallel means on, perpendicular means closed (1/4 turn).", why: "Failsafe for flooding prevention." },
      { id: "b3", text: "Turn off double breaker for hot water heater", how: "Main electrical panel in basement underneath foyer, on the right side, labeled — flick to the off side.", why: "Save energy; failsafe if a leak occurs." },
      { id: "b4", text: "Lock basement door", how: "", why: "" }
    ]
  },
  {
    section: "Main Floor",
    items: [
      { id: "m1", text: "Clean toilet", how: "Avoid bleach — it messes with the microbes in the septic tank.", why: "Toilets are gross." },
      { id: "m2", text: "Clean shower", how: "Spray vinegar/dish soap mixture, let sit 5 minutes, wipe and rinse.", why: "" },
      { id: "m3", text: "Open taps then close once drained (winter)", how: "Kitchen and main floor sink — relieve pressure and remove water.", why: "Failsafe if heat goes off." },
      { id: "m4", text: "Turn furnace off OR set to 50°F (winter)", how: "Thermostat outside the Millview Suite — click the down arrow until display reads 50.", why: "Prevent pipes from freezing." },
      { id: "m5", text: "Ensure HRV is on", how: "Beside the thermostat — power button, straightforward.", why: "Prevents mustiness." },
      { id: "m6", text: "Shut and lock all windows", how: "", why: "Rain, creeps and thieves." },
      { id: "m7", text: "Collect and remove garbage/recycling", how: "Double bag containers.", why: "Stink prevention." },
      { id: "m8", text: "Vacuum rugs and floor", how: "Stand-up or shopvac — start on 2, tap for full power 3 — empty after use.", why: "" },
      { id: "m9", text: "Turn off all burners and oven", how: "Double check — they turn on accidentally.", why: "Fire risk, wasted electricity." },
      { id: "m10", text: "Ensure all fridge doors shut", how: "", why: "Wasted electricity and food." },
      { id: "m11", text: "Remove perishable food", how: "", why: "Limited storage; considerate of others." },
      { id: "m12", text: "Wipe out fridge/freezer", how: "", why: "" },
      { id: "m13", text: "Tidy", how: "", why: "Next to Godliness." },
      { id: "m14", text: "Remove all socks", how: "", why: "We have enough in the collection already." },
      { id: "m15", text: "Turn off all lights", how: "", why: "Wasted electricity." },
      { id: "m16", text: "Lock all doors (3 of them)", how: "Main door: rotate knob 90 degrees inside, double check.", why: "Creeps and thieves." },
      { id: "m17", text: "Shut woodstove tight", how: "Handle in up position — will feel tight, not limp.", why: "Very serious fire risk." },
      { id: "m18", text: "Got dump card?", how: "On fridge — may need to pay per bag.", why: "Less smelly car ride home." },
      { id: "m19", text: "Strip beds and take sheets", how: "", why: "" },
      { id: "m20", text: "Clean and stow dishes/pots", how: "", why: "" },
      { id: "m21", text: "Clean kitchen sink, stove, counters", how: "Use special cleaner under sink.", why: "" }
    ]
  },
  {
    section: "Cabins, Yard, Docks",
    items: [
      { id: "c1", text: "Tidy and stow yard/dock items", how: "Cushions in basement.", why: "Pride, things blow away." },
      { id: "c2", text: "Empty cabin fridge", how: "Prop door open, unplug.", why: "Mold prevention." },
      { id: "c3", text: "Turn off breakers to both cabins", how: "", why: "Prevents wasted electricity." },
      { id: "c4", text: "Unplug pump for cabin", how: "Behind cabin near pump house — unplug from extension cord.", why: "Wasted electricity, flood risk." },
      { id: "c5", text: "Close and latch outhouse door", how: "", why: "Critter prevention." },
      { id: "c6", text: "Windows shut/locked in cabins", how: "Summer: small peak windows can stay open for airing.", why: "" },
      { id: "c7", text: "Lock bunkie/cabin doors", how: "Honeymoon suite has a padlock — may be on the 2x4 shelf inside the door.", why: "" },
      { id: "c8", text: "Remove gas tank/hose from TinTin", how: "Place under sea flea or outhouse, NOT inside.", why: "Boat fills with water, prevents theft." },
      { id: "c9", text: "Outdoor dartboard — move to basement wall", how: "Slide upwards.", why: "Water ruins dartboards." },
      { id: "c10", text: "Outdoor tap off", how: "1/4 turn.", why: "Failsafe if pump not turned off." }
    ]
  }
];

const STATE_KEY = "cottageClosingChecklistState";
const CUSTOM_KEY = "cottageClosingCustomItems";

function loadState() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveState(state) {
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
  } catch (e) {}
}

function loadCustomItems() {
  try {
    const raw = localStorage.getItem(CUSTOM_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function saveCustomItems(items) {
  try {
    localStorage.setItem(CUSTOM_KEY, JSON.stringify(items));
  } catch (e) {}
}

let state = loadState();
let customItems = loadCustomItems();

function itemsForSection(section) {
  return section.items.concat(customItems.filter(ci => ci.section === section.section));
}

function allItems() {
  return DATA.flatMap(s => itemsForSection(s));
}

function updateProgress() {
  const items = allItems();
  const total = items.length;
  const done = items.filter(i => state[i.id]).length;
  document.getElementById("progressText").textContent = `${done} / ${total}`;
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById("progressFill").style.width = pct + "%";
}

function toggleCheck(id) {
  state[id] = !state[id];
  saveState(state);
  const itemEl = document.querySelector(`.item[data-id="${CSS.escape(id)}"]`);
  if (itemEl) itemEl.classList.toggle("checked", !!state[id]);
  updateProgress();
}

function toggleOpen(id) {
  const itemEl = document.querySelector(`.item[data-id="${CSS.escape(id)}"]`);
  if (itemEl && itemEl.classList.contains("has-detail")) {
    itemEl.classList.toggle("open");
  }
}

function toggleWhy(id) {
  const box = document.querySelector(`.why-box[data-id="${CSS.escape(id)}"]`);
  if (box) box.classList.toggle("open");
}

function removeCustomItem(id) {
  customItems = customItems.filter(ci => ci.id !== id);
  saveCustomItems(customItems);
  if (state[id]) {
    delete state[id];
    saveState(state);
  }
  render();
}

function buildItemEl(item) {
  const hasHow = !!item.how;
  const hasWhy = !!item.why;
  const hasDetail = hasHow || hasWhy;

  const itemEl = document.createElement("div");
  itemEl.className = "item" + (hasDetail ? " has-detail" : "") + (state[item.id] ? " checked" : "");
  itemEl.setAttribute("data-id", item.id);

  const row = document.createElement("div");
  row.className = "item-row";

  const circle = document.createElement("button");
  circle.className = "check-circle";
  circle.setAttribute("aria-label", "Toggle done: " + item.text);
  circle.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
  circle.addEventListener("click", (e) => {
    e.stopPropagation();
    toggleCheck(item.id);
  });

  const textWrap = document.createElement("div");
  textWrap.className = "item-text-wrap";
  const textEl = document.createElement("div");
  textEl.className = "item-text";
  textEl.textContent = item.text;
  textWrap.appendChild(textEl);
  if (item.custom) {
    const tag = document.createElement("span");
    tag.className = "custom-tag";
    tag.textContent = "added";
    textEl.appendChild(tag);
  }
  if (hasDetail) {
    const arrow = document.createElement("span");
    arrow.className = "disclosure-arrow";
    arrow.textContent = "▾";
    textWrap.appendChild(arrow);
    textWrap.addEventListener("click", () => toggleOpen(item.id));
  }

  row.appendChild(circle);
  row.appendChild(textWrap);

  if (item.custom) {
    const removeBtn = document.createElement("button");
    removeBtn.className = "remove-btn";
    removeBtn.setAttribute("aria-label", "Remove item: " + item.text);
    removeBtn.textContent = "×";
    removeBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (confirm(`Remove "${item.text}"?`)) {
        removeCustomItem(item.id);
      }
    });
    row.appendChild(removeBtn);
  }

  itemEl.appendChild(row);

  if (hasDetail) {
    const detail = document.createElement("div");
    detail.className = "detail";

    const howBox = document.createElement("div");
    howBox.className = "how-box";

    if (hasHow) {
      const howLabel = document.createElement("span");
      howLabel.className = "how-label";
      howLabel.textContent = "How";
      howBox.appendChild(howLabel);
      const howText = document.createElement("span");
      howText.textContent = item.how;
      howBox.appendChild(howText);
    }

    if (hasWhy) {
      const whyToggle = document.createElement("div");
      whyToggle.className = "why-toggle";
      whyToggle.textContent = "Why?";
      whyToggle.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleWhy(item.id);
      });
      howBox.appendChild(whyToggle);

      const whyBox = document.createElement("div");
      whyBox.className = "why-box";
      whyBox.setAttribute("data-id", item.id);
      whyBox.textContent = item.why;
      howBox.appendChild(whyBox);
    }

    detail.appendChild(howBox);
    itemEl.appendChild(detail);
  }

  return itemEl;
}

function render() {
  const main = document.getElementById("main");
  main.innerHTML = "";

  DATA.forEach(section => {
    const sectionEl = document.createElement("div");
    sectionEl.className = "section";

    const titleEl = document.createElement("div");
    titleEl.className = "section-title";
    titleEl.textContent = section.section;
    sectionEl.appendChild(titleEl);

    const card = document.createElement("div");
    card.className = "card";

    itemsForSection(section).forEach(item => {
      card.appendChild(buildItemEl(item));
    });

    sectionEl.appendChild(card);
    main.appendChild(sectionEl);
  });

  updateProgress();
}

document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("Reset all checked items for next time?")) {
    state = {};
    saveState(state);
    render();
  }
});

// --- Add item form ---
const addItemToggle = document.getElementById("addItemToggle");
const addItemToggleLabel = document.getElementById("addItemToggleLabel");
const addItemForm = document.getElementById("addItemForm");
const newItemSection = document.getElementById("newItemSection");
const newItemText = document.getElementById("newItemText");
const newItemHow = document.getElementById("newItemHow");
const newItemWhy = document.getElementById("newItemWhy");

DATA.forEach(section => {
  const opt = document.createElement("option");
  opt.value = section.section;
  opt.textContent = section.section;
  newItemSection.appendChild(opt);
});

function resetAddItemForm() {
  newItemText.value = "";
  newItemHow.value = "";
  newItemWhy.value = "";
  newItemSection.selectedIndex = 0;
}

function closeAddItemForm() {
  addItemForm.classList.remove("open");
  addItemToggleLabel.textContent = "+ Add Item";
}

function openAddItemForm() {
  addItemForm.classList.add("open");
  addItemToggleLabel.textContent = "− Close";
  newItemText.focus();
}

addItemToggle.addEventListener("click", () => {
  if (addItemForm.classList.contains("open")) {
    closeAddItemForm();
  } else {
    openAddItemForm();
  }
});

document.getElementById("cancelNewItem").addEventListener("click", () => {
  resetAddItemForm();
  closeAddItemForm();
});

document.getElementById("submitNewItem").addEventListener("click", () => {
  const text = newItemText.value.trim();
  if (!text) {
    newItemText.focus();
    return;
  }
  const newItem = {
    id: "custom-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7),
    section: newItemSection.value,
    text: text,
    how: newItemHow.value.trim(),
    why: newItemWhy.value.trim(),
    custom: true
  };
  customItems.push(newItem);
  saveCustomItems(customItems);
  resetAddItemForm();
  closeAddItemForm();
  render();
});

render();
</script>

</body>
</html>
