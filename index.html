<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life at our Cottage</title>
<style>
  :root {
    --bg: #f5f1e8;
    --card-bg: #ffffff;
    --border: #d9d2c2;
    --text: #2e2a24;
    --muted: #756e60;
    --green: #2e7d4f;
    --green-light: #e6f4ea;
    --section-bg: #efe9d8;
    --accent: #8a6d3b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 16px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    padding-top: 48px;
    padding-bottom: 8px;
  }
  .cabin-icon {
    width: 84px;
    height: 84px;
    margin: 0 auto 12px;
    display: block;
  }
  h1 {
    font-size: 1.9rem;
    margin: 0 0 4px;
    color: var(--text);
  }
  .subtitle {
    font-size: 1.05rem;
    color: var(--accent);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-weight: 600;
    margin: 0 0 40px;
  }
  nav.pages {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .page-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    text-decoration: none;
    color: var(--text);
    transition: background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
  }
  .page-btn:hover {
    background: var(--green-light);
    border-color: var(--green);
    transform: translateY(-1px);
  }
  .page-btn .icon {
    flex: 0 0 auto;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--green);
  }
  .page-btn .icon svg {
    width: 26px;
    height: 26px;
  }
  .page-btn-text {
    flex: 1;
  }
  .page-btn-title {
    font-size: 1.05rem;
    font-weight: 600;
  }
  .page-btn-desc {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 2px;
  }
  .page-btn .arrow {
    flex: 0 0 auto;
    color: var(--muted);
    font-size: 1.2rem;
  }
  .page-btn.disabled {
    cursor: default;
    opacity: 0.6;
  }
  .page-btn.disabled:hover {
    background: var(--card-bg);
    border-color: var(--border);
    transform: none;
  }
  .page-btn.disabled .icon {
    color: var(--muted);
  }
  .coming-soon-tag {
    flex: 0 0 auto;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
    background: var(--section-bg);
    border-radius: 4px;
    padding: 3px 8px;
    white-space: nowrap;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
    margin-top: 48px;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <svg class="cabin-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- roof -->
      <polygon points="50,14 92,48 84,48 84,52 16,52 16,48 8,48" fill="#8a6d3b"/>
      <!-- chimney -->
      <rect x="66" y="20" width="9" height="16" fill="#8a6d3b"/>
      <!-- cabin body -->
      <rect x="20" y="52" width="60" height="34" fill="#efe9d8" stroke="#8a6d3b" stroke-width="3"/>
      <!-- horizontal log lines -->
      <line x1="20" y1="61" x2="80" y2="61" stroke="#8a6d3b" stroke-width="2"/>
      <line x1="20" y1="70" x2="80" y2="70" stroke="#8a6d3b" stroke-width="2"/>
      <line x1="20" y1="79" x2="80" y2="79" stroke="#8a6d3b" stroke-width="2"/>
      <!-- door -->
      <rect x="43" y="66" width="14" height="20" fill="#2e7d4f"/>
      <circle cx="54" cy="76" r="1.4" fill="#efe9d8"/>
      <!-- windows -->
      <rect x="27" y="59" width="9" height="9" fill="#2e7d4f"/>
      <rect x="64" y="59" width="9" height="9" fill="#2e7d4f"/>
    </svg>
    <h1>Life at our Cottage</h1>
    <p class="subtitle">The Point</p>
  </header>

  <nav class="pages">
    <a class="page-btn" href="cottage-closing-checklist.html">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
      </span>
      <span class="page-btn-text">
        <div class="page-btn-title">Closing Checklist</div>
        <div class="page-btn-desc">Step-by-step list for closing up for the season</div>
      </span>
      <span class="arrow">›</span>
    </a>

    <a class="page-btn" href="https://baxterjamie-source.github.io/baseballdarts/darts-baseball.html">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5.2"></circle><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"></circle></svg>
      </span>
      <span class="page-btn-text">
        <div class="page-btn-title">Baseball Darts</div>
        <div class="page-btn-desc">Dartboard scoring app for our baseball darts games</div>
      </span>
      <span class="arrow">›</span>
    </a>

    <div class="page-btn disabled">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
      </span>
      <span class="page-btn-text">
        <div class="page-btn-title">Opening Checklist</div>
        <div class="page-btn-desc">Getting the cottage ready for the season</div>
      </span>
      <span class="coming-soon-tag">Coming soon</span>
    </div>

    <!-- Add more pages here as they're created, copy a .page-btn <a> block above -->
  </nav>

  <footer>baxterjamie-source / cottage</footer>
</div>

</body>
</html>
